# Project-level overrides. Anything omitted falls back to the skill defaults.
# Tier names only. Never write model names here: the strong tier is resolved by the
# existing claude-bridge mode (confirmed in chat), the efficient tier is the host's current model.
workflow_version: 1

routing:
  architect: strong
  executor: efficient
  reviewer: strong

tiers:
  strong:
    via: claude-bridge
    bridge_mode: ask        # ask | opus | sonnet | default  (ask = confirm in chat at the start of each run)
  efficient:
    via: native             # whatever model the current host chat is already using

automation:
  enabled: true
  auto_continue_low_risk: true
  stop_on_high_risk_change: true
  max_tasks_per_run: 5
  max_executor_retries: 2
  max_rework_cycles: 3
  max_resolve_attempts: 1   # strong-model root-cause rounds per task before asking the user

review:
  required: true
  checkpoint_every_n_tasks: 3

risk:
  force_strong_for:
    - auth
    - permissions
    - payments
    - encryption
    - schema-migration
    - destructive-data-change
    - production-infra
    - security
    - concurrency
