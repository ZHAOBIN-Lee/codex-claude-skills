# Project-level overrides. Anything omitted falls back to the skill defaults.
# Tier names only. Never write model names here: the strong tier is native Claude in Codex
# (Opus or Sonnet, confirmed in chat), the efficient tier is native GPT in Codex.
# How a run is carried out (execution mode) is chosen in chat at the start of each run.
workflow_version: 1

routing:
  architect: strong
  executor: efficient
  reviewer: strong

tiers:
  strong:
    via: claude_native
    model: ask              # ask | opus | sonnet  (ask = confirm in chat at the start of each run)
  efficient:
    via: gpt_native         # the GPT model in the Codex model picker

automation:
  enabled: true
  auto_continue_low_risk: true
  stop_on_high_risk_change: true
  max_tasks_per_run: 5
  max_executor_retries: 2
  max_rework_cycles: 3
  max_resolve_attempts: 1   # strong-model root-cause rounds per task before asking the user

review:
  required: true
  checkpoint_every_n_tasks: 3

risk:
  force_strong_for:
    - auth
    - permissions
    - payments
    - encryption
    - schema-migration
    - destructive-data-change
    - production-infra
    - security
    - concurrency
